  <circle cx="32" cy="32" r="22" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.85"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Crosshair ticks -->
  <line x1="32" y1="5" x2="32" y2="16" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="32" y2="59" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="5" y1="32" x2="16" y2="32" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="32" x2="59" y2="32" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
