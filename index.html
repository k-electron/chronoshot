<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChronoShot - Tactical Time-Dilation Top-Down Combat Engine</title>
    <meta name="description" content="ChronoShot - A tactical time-dilation top-down combat game. Time moves only when you move." />
    <meta name="theme-color" content="#0b0d11" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ChronoShot - Tactical Time-Dilation Combat" />
    <meta property="og:description" content="Tactical time-dilation top-down combat game. Time moves only when you move." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ChronoShot" />
    <meta name="twitter:description" content="Tactical time-dilation top-down combat game. Time moves only when you move." />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #0b0d11;
        color: #e0e6ed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        user-select: none;
      }
      #game-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      canvas {
        display: block;
        background: #0b0d11;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.85), 0 0 1px rgba(0, 240, 255, 0.3);
        border: 1px solid #1c2330;
        border-radius: 6px;
        cursor: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas" width="960" height="640"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
