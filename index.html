<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChronoShot - Tactical Time-Dilation Top-Down Combat Engine</title>
    <meta name="description" content="ChronoShot - A tactical time-dilation top-down combat game. Time moves only when you move." />
    <meta name="theme-color" content="#0b0d11" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ChronoShot - Tactical Time-Dilation Combat" />
    <meta property="og:description" content="Tactical time-dilation top-down combat game. Time moves only when you move." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ChronoShot" />
    <meta name="twitter:description" content="Tactical time-dilation top-down combat game. Time moves only when you move." />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #0b0d11;
        color: #e0e6ed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        user-select: none;
      }
      #game-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      canvas {
        display: block;
        background: #0e1117;
        box-shadow: 0 0 32px rgba(0, 0, 0, 0.75), 0 0 1px rgba(0, 240, 255, 0.2);
        border: 1px solid #263242;
        border-radius: 4px;
        cursor: crosshair;
      }
      .controls-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 960px;
        padding: 10px 4px 0 4px;
        font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
        font-size: 11px;
        letter-spacing: 0.5px;
        color: #6e7681;
      }
      .controls-bar span strong {
        color: #00f0ff;
        font-weight: 700;
      }
      .controls-bar span.accent strong {
        color: #ff7961;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas" width="960" height="640"></canvas>
      <div class="controls-bar">
        <span><strong>[WASD]</strong> MOVE (TIME SCALE)</span>
        <span><strong>[MOUSE]</strong> AIM</span>
        <span><strong>[L-CLICK]</strong> FIRE (+6 TICKS)</span>
        <span class="accent"><strong>[R]</strong> RELOAD (+30 TICKS)</span>
        <span><strong>[R]</strong> RESTART ON DEFEAT</span>
        <span><strong>[M]</strong> MUTE</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
